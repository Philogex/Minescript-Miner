name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mod:
    name: Build and test ${{ matrix.platform }} mod
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-2022
            platform: windows-x86_64
    defaults:
      run:
        working-directory: fabric
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check generated catalog
        run: python ../tools/generate_shape_catalog.py --check

      - name: Build mod and run Java and native tests
        run: ./gradlew build check --no-daemon

      - name: Check native loading from packaged mod
        run: ./gradlew benchmark -PbenchmarkSamples=1 -PbenchmarkWarmup=0 --no-daemon

      - name: Upload mod
        uses: actions/upload-artifact@v7
        with:
          name: minecraft-miner-${{ matrix.platform }}
          path: fabric/build/libs/*-${{ matrix.platform }}.jar
          if-no-files-found: error

      - name: Upload test and load-check reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: minecraft-miner-reports-${{ matrix.platform }}
          path: |
            fabric/build/reports/tests/test/
            fabric/build/test-results/test/
            fabric/build/native/Testing/Temporary/LastTest.log
            fabric/build/reports/benchmark/
          if-no-files-found: warn

  performance:
    name: Record native performance metadata
    if: startsWith(github.ref, 'refs/tags/')
    needs: mod
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install profiling dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++ valgrind

      - name: Prepare release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: echo "tag=$(python tools/release_tag.py "$RELEASE_TAG")" >> "$GITHUB_OUTPUT"

      - name: Run Callgrind benchmark
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: scripts/run-performance-report.sh "$RELEASE_TAG" build/profile/report

      - name: Upload performance report
        uses: actions/upload-artifact@v7
        with:
          name: minecraft-miner-performance
          path: |
            build/profile/report/performance-report.json
            build/profile/report/benchmark-output.txt
            build/profile/report/callgrind-annotate.txt
            build/profile/report/callgrind.out
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [mod, performance]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download mod artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: minecraft-miner-*-x86_64
          path: release-assets
          merge-multiple: true

      - name: Download performance report
        uses: actions/download-artifact@v8
        with:
          name: minecraft-miner-performance
          path: release-assets

      - name: Create release or upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No release assets found." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --generate-notes --verify-tag
          fi
