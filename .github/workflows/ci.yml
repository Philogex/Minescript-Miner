name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to rebuild and publish (optional)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  mod:
    name: Build and test ${{ matrix.platform }} mod
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-2022
            platform: windows-x86_64
    defaults:
      run:
        working-directory: fabric
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check generated catalog
        run: python ../tools/generate_shape_catalog.py --check

      - name: Build mod and run Java and native tests
        run: ./gradlew build check --no-daemon

      - name: Check native loading from packaged mod
        run: ./gradlew benchmark -PbenchmarkSamples=1 -PbenchmarkWarmup=0 --no-daemon

      - name: Upload mod
        uses: actions/upload-artifact@v7
        with:
          name: minecraft-miner-${{ matrix.platform }}
          path: fabric/build/libs/*-${{ matrix.platform }}.jar
          if-no-files-found: error

      - name: Upload test and load-check reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: minecraft-miner-reports-${{ matrix.platform }}
          path: |
            fabric/build/reports/tests/test/
            fabric/build/test-results/test/
            fabric/build/native/Testing/Temporary/LastTest.log
            fabric/build/reports/benchmark/
          if-no-files-found: warn

  performance:
    name: Record native performance metadata
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: mod
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Install profiling dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++ valgrind

      - name: Prepare release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: echo "tag=$(python tools/release_tag.py "$RELEASE_TAG")" >> "$GITHUB_OUTPUT"

      - name: Run Callgrind benchmark
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: scripts/run-performance-report.sh "$RELEASE_TAG" build/profile/report

      - name: Upload performance report
        uses: actions/upload-artifact@v7
        with:
          name: minecraft-miner-performance
          path: |
            build/profile/report/performance-report.json
            build/profile/report/benchmark-output.txt
            build/profile/report/callgrind-annotate.txt
            build/profile/report/callgrind.out
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [mod, performance]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download Linux mod
        uses: actions/download-artifact@v8
        with:
          name: minecraft-miner-linux-x86_64
          path: release-assets/linux

      - name: Download Windows mod
        uses: actions/download-artifact@v8
        with:
          name: minecraft-miner-windows-x86_64
          path: release-assets/windows

      - name: Download performance report
        uses: actions/download-artifact@v8
        with:
          name: minecraft-miner-performance
          path: release-assets/performance

      - name: Upload release assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          shopt -s nullglob
          linux_mods=(release-assets/linux/minecraft-miner-*-linux-x86_64.jar)
          windows_mods=(release-assets/windows/minecraft-miner-*-windows-x86_64.jar)
          if [[ "${#linux_mods[@]}" -ne 1 || "${#windows_mods[@]}" -ne 1 ]]; then
            echo "Expected exactly one Linux and one Windows mod JAR." >&2
            exit 1
          fi
          assets=(
            "${linux_mods[0]}"
            "${windows_mods[0]}"
            release-assets/performance/performance-report.json
            release-assets/performance/benchmark-output.txt
            release-assets/performance/callgrind-annotate.txt
            release-assets/performance/callgrind.out
          )
          for asset in "${assets[@]}"; do
            if [[ ! -f "$asset" ]]; then
              echo "Missing release asset: $asset" >&2
              exit 1
            fi
          done

          if ! release_is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            gh release create "$RELEASE_TAG" --draft --generate-notes --verify-tag
            release_is_draft=true
          fi
          for asset in "${assets[@]}"; do
            echo "Uploading $(basename "$asset")"
            gh release upload "$RELEASE_TAG" "$asset" --clobber
          done
          if [[ "$release_is_draft" == true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false
          fi
